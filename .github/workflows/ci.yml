name: CI

on:
  push:
  pull_request:

jobs:
  leakage-test:
    name: Point-in-time leakage test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The leakage test is a non-negotiable gate (CLAUDE.md). It must never be
      # weakened or skipped.
      - name: Run tests
        run: pytest
